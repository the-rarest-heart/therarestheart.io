# therarestheart.io runs on Cloudflare Pages (project therarestheart-io),
# built from the main branch of this repository. Not Workers — a `wrangler deploy`
# here would create a separate Worker that does not serve the domain.
#
# _worker.js at the root puts Pages in advanced mode: it handles /api/* itself
# and hands every other request to the static files via env.ASSETS.

name = "therarestheart-io"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

# The Commons. Created with:  wrangler d1 create trh-commons
[[d1_databases]]
binding = "DB"
database_name = "trh-commons"
database_id = "008751ed-6e40-4354-aa04-e1bd2caf8367"

# Images, video and documents attached to notes and threads. The index lives
# in D1; the bytes live here.
#
# COMMENTED OUT UNTIL THE BUCKET EXISTS. Pages refuses to publish the Function
# at all if a binding names a bucket that is not there — assets go up, /api/*
# does not, and the Commons goes down with it. The Worker already copes with a
# missing MEDIA binding: uploads answer "File storage is not connected yet."
# and the upload box never draws itself.
#
# To turn storage on:
#   1. Enable R2 in the Cloudflare dashboard (one button, needs a card on file)
#   2. npx wrangler r2 bucket create trh-media
#   3. Delete the three # below, commit, push
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "trh-media"
