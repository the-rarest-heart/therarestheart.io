name = "therarestheart"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# The static site. The Worker handles /api/* and hands everything else to this.
[assets]
directory = "."
binding = "ASSETS"

# The Commons. Create it once with:  wrangler d1 create trh-commons
# then paste the id it prints into database_id below.
[[d1_databases]]
binding = "DB"
database_name = "trh-commons"
database_id = "008751ed-6e40-4354-aa04-e1bd2caf8367"
